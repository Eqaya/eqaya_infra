name: Deploy Production Infrastructure and Backend

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.7
  APP_REPOSITORY: ${{ vars.EQAYA_APP_REPOSITORY || format('{0}/eqaya-platform', github.repository_owner) }}
  APP_REF: ${{ vars.EQAYA_APP_REF || 'main' }}

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check
        working-directory: ./prod

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: ./prod

      - name: Terraform validate
        run: terraform validate
        working-directory: ./prod

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    environment: production
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      PROD_APP_SECRETS_JSON: ${{ secrets.PROD_APP_SECRETS_JSON }}
      PROD_APP_ENVIRONMENT_JSON: ${{ vars.PROD_APP_ENVIRONMENT_JSON }}
      PROD_BUDGET_ALERT_EMAILS_JSON: ${{ vars.PROD_BUDGET_ALERT_EMAILS_JSON }}

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ./infra/prod

      - name: Write optional production variables
        run: |
          # Defaults are held in shell variables, NOT written as literal "{}"
          # inside the parameter expansion: bash parses "${VAR:-{}}" by matching
          # the FIRST "}", which appends a stray brace to any non-empty value and
          # produces invalid JSON (jq: invalid JSON text passed to --argjson).
          empty_obj='{}'
          empty_arr='[]'
          jq -n \
            --argjson app_secrets "${PROD_APP_SECRETS_JSON:-$empty_obj}" \
            --argjson app_environment "${PROD_APP_ENVIRONMENT_JSON:-$empty_obj}" \
            --argjson budget_alert_emails "${PROD_BUDGET_ALERT_EMAILS_JSON:-$empty_arr}" \
            '{
              app_secrets: $app_secrets,
              app_environment: $app_environment,
              budget_alert_emails: $budget_alert_emails
            }' > prod.auto.tfvars.json
        working-directory: ./infra/prod

      - name: Bootstrap ECR
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -target=aws_ecr_repository.prod \
            -target=aws_ecr_lifecycle_policy.prod \
            -var="app_image=bootstrap"
        working-directory: ./infra/prod

      - name: Read ECR repository URL
        id: ecr
        run: echo "repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
        working-directory: ./infra/prod

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        env:
          ECR_REPOSITORY_URL: ${{ steps.ecr.outputs.repository_url }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REPOSITORY_URL:$IMAGE_TAG"
          docker build \
            -f app/backend/Dockerfile \
            -t "$IMAGE_URI" \
            app/backend
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var="app_image=${{ steps.image.outputs.uri }}"
        working-directory: ./infra/prod

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: ./infra/prod

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)"
        working-directory: ./infra/prod

      # ---- Frontend: build the SPA and publish to S3 + CloudFront ----
      - name: Read frontend outputs
        id: frontend
        working-directory: ./infra/prod
        run: |
          echo "bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and publish frontend
        working-directory: ./app
        env:
          REACT_APP_API_URL: https://api.eqaya.com/api
          # Don't fail the static build on ESLint warnings.
          CI: "false"
        run: |
          npm ci
          npm run build --workspace frontend
          aws s3 sync frontend/build "s3://${{ steps.frontend.outputs.bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.frontend.outputs.distribution }}" \
            --paths '/*'
